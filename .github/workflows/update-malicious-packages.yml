name: Update malicious package feeds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feed repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Clone OpenSSF malicious-packages
        run: |
          git clone --depth 1 https://github.com/ossf/malicious-packages.git upstream

      - name: Run feed builder
        run: |
          python scripts/build_feed.py

      - name: Show feed sizes
        run: |
          # include only and all files for all supported ecosystems
          ls -lh feeds/npm/
          du -h feeds/npm/*.csv

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # include only and all files for all supported ecosystems
          git add feeds/npm/malicious-packages.csv
          git add feeds/npm/malicious-packages-recent.csv

          if git diff --cached --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi

          git commit -m "Update malicious npm package feeds"
          git push